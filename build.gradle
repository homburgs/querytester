import org.jetbrains.changelog.Changelog
import org.jetbrains.intellij.platform.gradle.IntelliJPlatformType
import org.jetbrains.intellij.platform.gradle.TestFrameworkType

import java.text.SimpleDateFormat

plugins {
    id "java"
    id 'org.jetbrains.intellij.platform' version '2.19.0'
    id "org.jetbrains.changelog" version "2.5.0"
}

group = "com.hsofttec.intellij"
version = "${pluginVersion}"

def lombokVersion = '1.18.48'

java {
    sourceCompatibility = javaSourceVersion
    targetCompatibility = javaTargetVersion
}

repositories {
    mavenLocal()
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
    maven {
        authentication {
            basic(BasicAuthentication)
        }
        credentials {
            username = providers.gradleProperty('ceyoniq_artifact_username').getOrNull()
            password = providers.gradleProperty('ceyoniq_artifact_password').getOrNull()
        }
        url = "https://artifact.nscale.eu/repository/nscale-java-advanced-connector"
    }
}

intellijPlatform {
    buildSearchableOptions = false
    pluginConfiguration {
        name = "QueryTester"
        version = "${pluginVersion}"
        vendor {
            name = 'Sven Homburg'
            email = 'Sven.Homburg@hsofttec.com'
        }
        ideaVersion {
            sinceBuild = '243'
            untilBuild = '262.*'
        }
        changeNotes = provider {
            changelog.renderItem(
                    (changelog.getOrNull(project.version.toString()) ?: changelog.getUnreleased())
                            .withHeader(false)
                            .withEmptySections(false),
                    Changelog.OutputType.HTML
            )
        }
    }
    signing {
        certificateChain = System.getenv("CERTIFICATE_CHAIN")
        privateKey = System.getenv("PRIVATE_KEY")
        password = System.getenv("PRIVATE_KEY_PASSWORD")
    }
    pluginVerification {
        ides {
            create IntelliJPlatformType.IntellijIdeaCommunity, "2024.3"
            recommended()
        }
    }
    publishing {
        token = providers.gradleProperty('jetbrains_marketplace_token_querytester')
    }
}

changelog {
    path = "${project.projectDir}/CHANGELOG.md"
    header = "[${-> version.get()}] - ${new SimpleDateFormat("yyyy-MM-dd").format(new Date())}"
    headerParserRegex = ~/(\d+\.\d+\.\d+)/
    itemPrefix = "-"
    keepUnreleasedSection = true
    unreleasedTerm = "[Unreleased]"
    groups = ["Added", "Changed", "Removed", "Fixed", "Security"]
}

dependencies {
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation('commons-beanutils:commons-beanutils:1.11.0') {
        exclude group: "commons-collections"
    }
    implementation 'org.apache.commons:commons-collections4:4.5.0'
    implementation 'com.github.lgooddatepicker:LGoodDatePicker:11.2.1'
    implementation("com.ceyoniq.nscale.applicationlayer:al-advanced-connector:8.2.1100") {
        exclude group: "org.slf4j"
    }

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    intellijPlatform {
        intellijIdeaCommunity '2024.3.6'

        pluginVerifier()
        zipSigner()

        testFramework TestFrameworkType.Platform.INSTANCE
    }

    testImplementation 'junit:junit:4.13.2'
}
